:root{--bg:#0d1320;--card:#141c2c;--bd:#263046;--ink:#e8ecf4;--mute:#7c889e;--cy:#4f8bff;--pu:#a78bfa;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root[data-theme=light]{--bg:#f3f5f8;--card:#fff;--bd:#d6dbe3;--ink:#1a1f29;--mute:#5f6a7a;--cy:#0e7490;--pu:#6d44d6;--ok:#15803d;--bad:#c4301f;--warn:#a16207;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}
body{padding:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.5 Poppins,system-ui,sans-serif}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{background:none;border:0;color:var(--mute);padding:8px 12px;border-radius:8px;white-space:nowrap}
nav button.on{color:var(--ink);background:var(--card);box-shadow:inset 0 -2px var(--cy)}
main{width:100%;max-width:1400px;min-height:calc(100vh - 56px);margin:0 auto;padding:16px 14px 60px}
h2{margin:0 0 10px;font-size:1.3rem}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
.b{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;min-height:44px}
.b:hover:not(:disabled){border-color:var(--cy)}.b:disabled{opacity:.4;cursor:default}
.b.p{background:#1d63ff;border-color:#1d63ff;color:#fff;font-weight:600}
.b.d{border-color:var(--pu);color:var(--pu)}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sp{margin-left:auto}
.mono{font-family:"CxMono",ui-monospace,monospace}
.eq{font:700 clamp(1.7rem,8vw,2.6rem)/1.3 "CxMono",monospace;letter-spacing:.12em;white-space:pre;text-align:right;width:fit-content;max-width:100%;overflow-x:auto;margin:6px auto}
.eq i{display:block;border-top:3px solid var(--ink);font-style:normal;margin:2px 0}
.sub{color:var(--mute);font:500 1rem "CxMono",monospace;white-space:pre;text-align:right;width:fit-content;margin:0 auto;max-width:100%;overflow-x:auto}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.chip{border:2px solid var(--bd);background:var(--bg);border-radius:10px;padding:6px 0;text-align:center;font:700 1.2rem "CxMono",monospace}
.chip small{display:block;font-size:.95rem;color:var(--mute)}
.chip.sel{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 25%,transparent)}
.chip.as small{color:var(--cy)}.chip.cf{border-color:var(--warn)}.chip.cf small{color:var(--warn)}
.chip.ok{border-color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.pad .b{font:700 1.2rem "CxMono",monospace;padding:12px 0}
#msg{min-height:3em;margin:8px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{border:1px solid var(--bd);border-radius:20px;padding:2px 10px;font-size:.85rem;color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--cy),var(--pu));transition:width .25s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat b{display:block;font:700 1.6rem "CxMono",monospace}.stat span{color:var(--mute);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:60px;resize:vertical}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:380px;width:100%}
label.tg{display:flex;gap:10px;align-items:center;padding:8px 0}

.hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.ico{width:56px;height:56px;border-radius:14px;background:#1a2c52;display:grid;place-items:center;color:#6aa3ff}
.lab{color:#6aa3ff;font-weight:700;font-size:.8rem;letter-spacing:.02em}.tmr{font-weight:700;font-size:1.9rem;line-height:1.1}
.hr{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hr select{width:auto;min-height:44px}
.hr .b{display:flex;gap:8px;align-items:center}
.sh{font-size:1.35rem;margin:0 0 12px}.sh small{font-size:1rem;font-weight:400;color:var(--mute);margin-left:6px}
.big{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1.15fr;gap:24px;align-items:center}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.eqs{display:flex;flex-direction:column;align-items:flex-end;width:fit-content;margin:0 auto}
.nr{display:flex;align-items:flex-start;gap:12px}.op{width:28px;font-size:1.8rem;line-height:56px;color:var(--ink);text-align:center}
.cl{display:grid;gap:6px}.col{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:68px}
.lt{font:700 1.45rem "CxMono",monospace;letter-spacing:.1em;width:100%;text-align:center}
.dg{width:32px;height:32px;border:1px solid var(--bd);border-radius:6px;background:#17233d;color:#6c8fce;display:grid;place-items:center;font:500 .85rem "CxMono",monospace}
.dg.f{border-color:#2f7d4f}
.ln{align-self:stretch;border-top:1px solid #3b4660;margin:6px 0}
.mx{display:grid;grid-template-columns:22px repeat(10,minmax(0,1fr));gap:5px;align-items:center}
.mx b{font:700 .8rem "CxMono",monospace;color:var(--mute);text-align:center}
.mx .rl{background:none;border:0;color:var(--mute);font:700 .85rem "CxMono",monospace;padding:0}.mx .rl.s{color:var(--cy)}
.mc{font-family:CxMono,monospace;aspect-ratio:1/.95;border:1px solid #3a4560;border-radius:6px;background:#10192b;color:#dfe6f3;font-size:1rem;padding:0}
.mc.on{background:#2a3446;border-color:#22c55e}.mc.cf{border-color:var(--warn);background:#3a3220}
.mc:disabled{opacity:.7}
.dec{border:1px solid var(--bd);border-radius:12px;padding:18px;margin-top:20px}
.dec h3{margin:0 0 12px;font-size:1.1rem}
.dw{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.dw .gap{width:22px}
.dc{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 .8rem "CxMono",monospace;color:var(--mute)}
.dc u{text-decoration:none;min-height:1.2em}
.dc span{width:44px;height:52px;border:1px solid #22c55e;border-radius:6px;display:grid;place-items:center;color:#cfe8d8;font:500 1rem "CxMono",monospace;background:#0f1a22}
.dc.ok span{background:#12361f}
.opb{width:52px;font:700 1.4rem Poppins,sans-serif;padding:0}.opb.on{background:#1d63ff;border-color:#1d63ff;color:#fff}
@media(max-width:480px){.big{padding:12px}.mx{gap:3px;grid-template-columns:16px repeat(10,minmax(0,1fr))}.mc{aspect-ratio:1/1.15}.dc span{width:38px;height:46px}main{padding-left:8px;padding-right:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

(function(){

/* ---------- solver ---------- */
function solve(adds,sum,max,cap){
  max=max||2;cap=cap||3e7;var nodes=0;var W=sum.length;
  if(adds.some(function(a){return a.length>W}))return{count:0,sols:[],order:[]};
  var order=[],bound=[],seen={},c;
  for(c=0;c<W;c++){
    adds.forEach(function(a){var ch=a[a.length-1-c];if(ch&&!seen[ch]){seen[ch]=1;order.push(ch)}});
    var s=sum[W-1-c];if(!seen[s]){seen[s]=1;order.push(s)}
    bound[order.length-1]=c;
  }
  if(order.length>10)return{count:0,sols:[],order:order,tooMany:true};
  var lead={};adds.concat([sum]).forEach(function(w){if(w.length>1)lead[w[0]]=1});
  var val={},used=0,sols=[];
  function colOK(up){var carry=0;
    for(var k=0;k<=up;k++){var t=carry;
      for(var a=0;a<adds.length;a++){var ch=adds[a][adds[a].length-1-k];if(ch)t+=val[ch]}
      if(t%10!==val[sum[W-1-k]])return false;carry=(t/10)|0}
    return up<W-1||carry===0}
  (function rec(i){
    if(sols.length>=max||++nodes>cap)return;
    if(i===order.length){sols.push(Object.assign({},val));return}
    var L=order[i];
    for(var d=0;d<10;d++){
      if(used&(1<<d)||(d===0&&lead[L]))continue;
      val[L]=d;used|=1<<d;
      if(bound[i]===undefined||colOK(bound[i]))rec(i+1);
      used&=~(1<<d);delete val[L]}
  })(0);
  return{count:sols.length,sols:sols,order:order,trunc:nodes>cap};
}
var SYM={Addition:'+',Subtraction:'−',Multiplication:'×',Division:'÷'};
function parse(txt){
  var t=txt.toUpperCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/×/g,'*').replace(/÷/g,'/'),m=t.split('='),op,adds,mt;
  if(m.length!==2||!/^[A-Z]+$/.test(m[1]))return{err:'Write the puzzle as WORD + WORD = WORD: exactly one "=" and a single word on the right.'};
  if((mt=m[0].match(/^([A-Z]+)([-*\/])([A-Z]+)$/))){op={'-':'Subtraction','*':'Multiplication','/':'Division'}[mt[2]];adds=[mt[1],mt[3]]}
  else if(/^[A-Z]+(\+[A-Z]+)+$/.test(m[0])){op='Addition';adds=m[0].split('+')}
  else return{err:'Supported forms: A + B (+ C) = D, A - B = C, A * B = C, A / B = C.'};
  var all={};(adds.join('')+m[1]).split('').forEach(function(c){all[c]=1});
  if(Object.keys(all).length>10)return{err:'More than 10 different letters: no solution can exist.'};
  return{op:op,adds:adds,sum:m[1],letters:Object.keys(all).sort()};
}
function solveMul(X,Y,Z,max,cap){
  cap=cap||4e6;
  var ls=[];function add(c){if(ls.indexOf(c)<0)ls.push(c)}
  [X,Y,Z].forEach(function(w){add(w[w.length-1])});var k0=ls.length;
  [X,Y,Z].forEach(function(w){w.split('').reverse().forEach(add)});
  if(ls.length>10)return{count:0,sols:[],order:ls};
  var lead={};[X,Y,Z].forEach(function(w){if(w.length>1)lead[w[0]]=1});
  var v={},used=0,sols=[],nodes=0;
  function num(w){var n=0;for(var i=0;i<w.length;i++)n=n*10+v[w[i]];return n}
  (function rec(i){
    if(sols.length>=max||++nodes>cap)return;
    if(i===ls.length){if(num(X)*num(Y)===num(Z))sols.push(Object.assign({},v));return}
    var L=ls[i];
    for(var d=0;d<10;d++){
      if(used&(1<<d)||(d===0&&lead[L]))continue;
      v[L]=d;used|=1<<d;
      if(i!==k0-1||(v[X[X.length-1]]*v[Y[Y.length-1]])%10===v[Z[Z.length-1]])rec(i+1);
      used&=~(1<<d);delete v[L]}
  })(0);
  return{count:sols.length,sols:sols,order:ls,trunc:nodes>cap};
}
function solveOp(op,a,s,max,cap){
  max=max||2;
  if(op==='Addition')return solve(a,s,max,cap);
  if(op==='Subtraction')return solve([a[1],s],a[0],max,cap);
  if(op==='Multiplication')return solveMul(a[0],a[1],s,max,cap);
  return solveMul(a[1],s,a[0],max,cap);
}

function custom(){return '<h2>Custom puzzle</h2><div class="card"><input type="text" id="ce" placeholder="TWO + TWO = FOUR  ·  A - B = C  ·  AB * C = DEF  ·  ABC / D = EF" aria-label="Equation" class="mono"><div class="row" style="margin-top:8px"><button class="b p" id="cv">Validate and solve</button><button class="b" id="cs">Save puzzle</button><button class="b" id="cp">Practice this</button></div><div id="co" role="status"></div></div>'}
function genSettings(){
  var sel=function(v,c){return v===c?' selected':''};
  return '<h3 style="margin:16px 0 6px">Puzzle generation</h3><label for="gmode">Mode</label><select id="gmode"><option value="word"'+sel(prefs.mode,'word')+'>Word mode: real dictionary words</option><option value="classic"'+sel(prefs.mode,'classic')+'>Classic alphametics (SEND + MORE = MONEY…)</option><option value="mixed"'+sel(prefs.mode,'mixed')+'>Mixed</option></select>'
  +'<div class="row" style="margin-top:8px"><label>Word length <input type="number" id="gmin" min="1" max="7" placeholder="auto" value="'+(prefs.minLen||'')+'" style="width:80px"></label><label>to <input type="number" id="gmax" min="1" max="7" placeholder="auto" value="'+(prefs.maxLen||'')+'" style="width:80px"></label></div>'
  +'<div class="row"><label>Distinct letters <input type="number" id="glo" min="3" max="10" placeholder="auto" value="'+(prefs.minLet||'')+'" style="width:80px"></label><label>to <input type="number" id="ghi" min="3" max="10" placeholder="auto" value="'+(prefs.maxLet||'')+'" style="width:80px"></label></div>'
  +'<label for="gvoc">Vocabulary</label><select id="gvoc">'+[[2000,'Very common (top 2,000)'],[5000,'Common (top 5,000)'],[10000,'Wide (top 10,000)'],[20000,'Everything bundled (top 20,000)']].map(function(v){return '<option value="'+v[0]+'"'+((prefs.vocab||5000)===v[0]?' selected':'')+'>'+v[1]+'</option>'}).join('')+'</select>'
  +(function(){var f=effF(prefs.diff),ops=Array.isArray(prefs.ops)&&prefs.ops.length?prefs.ops:['Addition'],m=null;ops.forEach(function(o){m=m||advise(f,o)});return m?'<p class="warn" role="status">⚠ '+esc(m.msg)+' Suggested: 4–5 letter words, 7–9 distinct letters.</p>':''})()+'<p style="color:var(--mute);font-size:.85rem">Blank = set by the difficulty. More letters and longer words give more unique puzzles; very short words can take longer to find. Classic mode only offers addition.</p>'}
function settings(){return '<h2>Settings</h2><div class="card"><label class="tg"><input type="checkbox" id="sth"'+(prefs.theme==='dark'?' checked':'')+'> Dark theme</label><label class="tg"><input type="checkbox" id="stt"'+(prefs.timer?' checked':'')+'> Show timer</label><label class="tg"><input type="checkbox" id="stc"'+(prefs.confirm?' checked':'')+'> Confirm before reset, skip, give up and move on</label><label>Default difficulty</label><select id="sdf"><option'+(prefs.diff==='Easy'?' selected':'')+'>Easy</option><option'+(prefs.diff==='Medium'?' selected':'')+'>Medium</option><option'+(prefs.diff==='Hard'?' selected':'')+'>Hard</option></select><div class="row" style="margin-top:12px"><button class="b" id="srs">Reset preferences</button></div>'+genSettings()+'<p class="mono" style="color:var(--mute);font-size:.85rem">Keys: 0–9 assign · Backspace clear · ←/→ pick letter · Ctrl+Z / Ctrl+Y undo/redo · Enter check · H hint</p></div>'}
function render(){
  var tabs=[['dash','Dashboard'],['practice','Practice'],['lib','Cipher Library'],['custom','Custom Puzzle'],['stats','Statistics'],['set','Settings']];
  $('nav').innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  var f=document.activeElement&&document.activeElement.id;
  $('main').innerHTML={dash:dash,practice:practice,lib:library,custom:custom,stats:stats,set:settings}[tab]();
  bind();if(f&&$(f)&&f==='fl'){$(f).focus();$(f).setSelectionRange(99,99)}}
function on(id,fn){var e=$(id);if(e)e.onclick=fn}
function bind(){
  document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){tab=b.dataset.t;render();if(tab==='practice'&&!S)gen()}});
  document.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){S.sel=b.dataset.l;render()}});
  document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){var L=b.dataset.c[0],d=+b.dataset.c[1];S.sel=L;if(S.v[L]===d)clearSel();else setDigit(d)}});document.querySelectorAll('[data-op]').forEach(function(b){b.onclick=function(){var o=b.dataset.op,i=prefs.ops.indexOf(o);if(i>=0){if(prefs.ops.length===1){S.msg='Keep at least one operation selected.';S.cls='warn';return render()}prefs.ops.splice(i,1)}else prefs.ops.push(o);save('cx_prefs',prefs);gen()}});var hd=$('hd');if(hd)hd.onchange=function(){prefs.diff=hd.value;save('cx_prefs',prefs);gen()};
  on('go',gen);on('applysug',function(){var s=genAdv.suggest;prefs.minLen=s.minLen;prefs.maxLen=s.maxLen;prefs.minLet=s.minLet;prefs.maxLet=s.maxLet;save('cx_prefs',prefs);gen()});on('force',function(){prefs._force=true;gen()});on('retry',gen);on('relax',relax);on('chk',check);on('hint',hint);on('give',giveUp);on('rst',reset);on('skip',skip);on('next',moveOn);on('pause',pause);on('undo',undo);on('redo',redo);on('clr',clearSel);
  on('dgo',function(){prefs.diff=$('dd').value;tab='practice';gen()});on('resume',function(){tab='practice';render()});
  var n=$('notes');if(n)n.oninput=function(){S.notes=n.value};
  var fl=$('fl');if(fl)fl.oninput=function(){filter=fl.value;render()};
  document.querySelectorAll('[data-eq]').forEach(function(b){b.onclick=function(){var p=fromEq(b.dataset.eq,b.dataset.dd);if(p.err)return;tab='practice';newPuzzle(p)}});
  var ce=$('ce');
  function cv(){var p=fromEq(ce.value,'Medium'),o=$('co');if(p.err){o.className='bad';o.textContent=p.err;return null}
    o.className=p.nsol>1?'warn':'ok';o.innerHTML=(p.nsol>1?'Multiple solutions. First found: ':'Unique solution: ')+p.letters.map(function(L){return L+'='+p.sol[L]}).join(' ')+'<div class="sub">'+eqHTML(p,p.sol).plain+'</div>';return p}
  on('cv',cv);on('cs',function(){var p=cv();if(!p)return;var eq=ce.value.toUpperCase().trim(),dupl=lib.some(function(x){return x.eq===eq})||EX.some(function(x){return x[0]===eq});if(!lib.some(function(x){return x.eq===eq})&&!EX.some(function(x){return x[0]===eq})){lib.push({eq:eq,d:p.letters.length<=7?'Easy':p.letters.length<=9?'Medium':'Hard'});save('cx_lib',lib)}$('co').insertAdjacentHTML('beforeend','<div class="ok">'+(dupl?'Already in the library.':'Saved to the library.')+'</div>')});
  on('cp',function(){var p=cv();if(!p)return;tab='practice';newPuzzle(p)});
  on('clrstat',async function(){if(await conf('Clear all statistics? Saved puzzles and preferences stay.','Clear','Cancel')){hist=[];save('cx_hist',hist);render()}});
  var gm={gmin:'minLen',gmax:'maxLen',glo:'minLet',ghi:'maxLet'};
  Object.keys(gm).forEach(function(id){var e=$(id);if(e)e.onchange=function(){var v=parseInt(e.value,10);if(v>0)prefs[gm[id]]=v;else delete prefs[gm[id]];save('cx_prefs',prefs);render()}});
  var gmo=$('gmode');if(gmo)gmo.onchange=function(){prefs.mode=gmo.value;save('cx_prefs',prefs)};
  var gv=$('gvoc');if(gv)gv.onchange=function(){prefs.vocab=+gv.value;save('cx_prefs',prefs)};
  var th=$('sth');if(th)th.onchange=function(){prefs.theme=th.checked?'dark':'light';document.documentElement.dataset.theme=prefs.theme;save('cx_prefs',prefs)};
  var tt=$('stt');if(tt)tt.onchange=function(){prefs.timer=tt.checked;save('cx_prefs',prefs)};
  var tc=$('stc');if(tc)tc.onchange=function(){prefs.confirm=tc.checked;save('cx_prefs',prefs)};
  var sd=$('sdf');if(sd)sd.onchange=function(){prefs.diff=sd.value;save('cx_prefs',prefs)};
  on('srs',function(){prefs={theme:'dark',diff:'Medium',mode:'word',op:'Mixed',ops:['Addition','Subtraction','Multiplication','Division'],timer:true,confirm:true};save('cx_prefs',prefs);document.documentElement.dataset.theme='dark';render()})}
document.addEventListener('keydown',function(e){
  if(tab!=='practice'||!S||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.querySelector('.ov'))return;
  if(/^[0-9]$/.test(e.key))setDigit(+e.key);
  else if(e.key==='Backspace'||e.key==='Delete')clearSel();
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redo()}
  else if(e.key==='Enter'&&e.target.tagName!=='BUTTON')check();
  else if(e.key==='h'||e.key==='H')hint();
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var l=S.p.letters,i=l.indexOf(S.sel)+(e.key==='ArrowRight'?1:-1);S.sel=l[(i+l.length)%l.length];render()}});
if(!['Easy','Medium','Hard'].includes(prefs.diff))prefs.diff='Medium';if(!Array.isArray(prefs.ops)||!prefs.ops.length)prefs.ops=['Addition','Subtraction','Multiplication','Division'];
render();
})();
</script></body></html>
